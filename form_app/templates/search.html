
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Products</title>
</head>
<body>

    <h1>Search Products</h1>

    <form method="GET" action="{% url 'search_product' %}">
        <input
            type="text"
            name="q"
            placeholder="Enter product name"
            value="{{ query }}"
        >
        <button type="submit">Search</button>
    </form>

   
</body>
</html>
